services:
  db:
    image: mysql:8.0
    container_name: huella_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-huella}
      MYSQL_USER: ${DB_USER:-huella_user}
      MYSQL_PASSWORD: ${DB_PASS:-huella_pass}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: huella_app
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env
      
    ports:
      - "3000:3000"

volumes:
  db_data: